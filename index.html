 bar con l'insegna taroccata dal Capitano.","Il cartello che annuncia l'entrata nella città: non sto più nella pelle.","In questa collina antistante la città possiamo subito scorgere un gruppo di rifiuti intenti a raggiungere il fiume e migrare in altre terre.","Un antico portone risalente all'età della pietra, chiara rappresentazione della Porta dell'Inferno.","Antica automobile tolediana, si noti come sia stata efficientemente riparata con un antico metodo di fattura tolediana: il nastro adesivo.","La casa estiva di Franco.","La Guida Mazzapane di Toledo.","L'immancabile turista all'ultima moda.","Una chiesa con facciata in stile decadentista.","Una barriera di color rosa virile.","Un'antica strada Tolediana, le crepe sono state lasciate per sottolinearne l'antichità.","Un sacco di rifiuti che ha trovato riparo sotto un cartello stradale."];</script>	<script src="script.js"></script></head><body>	<div id="cover">		<div>			<img src="benvenuto.gif" style="display:block;margin:16px auto 32px auto;"></img>			<p style="color:#ff00ff;font-size:32px;">Il Capitano</p>			<p style="color:#aa0000;font-size:24px;">presenta:</p>			<p style="color:#ff0000;font-size:48px;">La Vera Madrid</p>			<p style="color:#000000;font-size:24px;font-style:italic;">Divino album di foto sulla Vera Ispagna</p>			<p id="start"><img src="mano1.gif" class="mano"/><span>Entra</span><img src="mano2.gif" class="mano"/></p>			<p id="loadingMess" style="color:red;font-size:20px;text-decoration:underline;">Caricamento in corso. Attendere...</p>		</div>	</div>		<a name="0"></a><table>		<tr><td class="imgCell"><img src="foto/foto1.jpg"></img></td></tr></table><a name="1"></a><table>		<tr><td class="imgCell"><img src="foto/foto2.jpg"></img></td></tr></table><table>		<tr><td class="imgCell"><img src="foto/foto33.jpg"></img></td></tr></table><a name="2"></a><table>		<tr><td class="imgCell"><img src="foto/foto3.jpg"></img></td></tr></table><a name="3"></a><table>		<tr><td class="imgCell"><img src="foto/foto43
